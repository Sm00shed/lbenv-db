name: Backfill full vcpkg hashes

on:
  workflow_dispatch:

jobs:
  backfill:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Backfill vcpkg hashes
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const crypto = require('crypto');
            const REPO = { owner: 'LadybirdBrowser', repo: 'ladybird' };

            // Same normalisation as update.yml
            const overridesAt = async (ref) => {
              const f = await github.rest.repos.getContent(
                { ...REPO, path: 'vcpkg.json', ref },
              );
              const json = JSON.parse(Buffer.from(f.data.content, 'base64').toString());
              return Object.fromEntries((json.overrides ?? []).map(p => [p.name, p.version]));
            };
            const fullHash = (o) => crypto.createHash('sha256')
              .update(JSON.stringify(Object.entries(o).sort()))
              .digest('hex');

            // Collect all TOMLs with short (8-char) vcpkg values
            const tomls = fs.readdirSync('.').filter(f => f.endsWith('.toml'));
            const shortToFiles = new Map(); // shortHash -> [{file, sha}]
            for (const file of tomls) {
              const content = fs.readFileSync(file, 'utf8');
              const vcpkg = content.match(/^vcpkg\s*=\s*"([^"]+)"/m)?.[1];
              if (!vcpkg || vcpkg.length === 64) continue; // already full
              if (!shortToFiles.has(vcpkg)) shortToFiles.set(vcpkg, []);
              shortToFiles.get(vcpkg).push({ file, sha: file.replace('.toml', '') });
            }

            if (!shortToFiles.size) {
              core.info('Nothing to backfill');
              return;
            }
            core.info(`Short hashes found: ${[...shortToFiles.keys()].join(', ')}`);

            // Resolve each short hash: compute full hash from one representative commit
            let patched = 0;
            for (const [short, files] of shortToFiles) {
              const full = fullHash(await overridesAt(files[0].sha));
              if (!full.startsWith(short)) {
                core.setFailed(
                  `Mismatch for ${short}: computed ${full.slice(0, 8)} `
                  + `at ${files[0].sha.slice(0, 8)} – aborting, nothing pushed.`,
                );
                return;
              }
              for (const { file } of files) {
                const content = fs.readFileSync(file, 'utf8');
                fs.writeFileSync(file, content.replace(
                  /^(vcpkg\s*=\s*)"[^"]+"/m, `$1"${full}"`,
                ));
                patched++;
              }
              core.info(`${short} -> ${full} (${files.length} files)`);
            }
            core.info(`Patched ${patched} TOML files`);

      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name  "Sm00shed"
          git config user.email "Sm00shed@users.noreply.github.com"
          git add *.toml
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          COUNT=$(git diff --cached --name-only | wc -l)
          git commit -m "db: backfill full vcpkg hashes ($COUNT files)"
          git push
