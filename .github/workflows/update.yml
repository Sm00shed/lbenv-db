name: Update Ladybird versions

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: update-versions
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check for open vcpkg-drift issue
        id: drift-check
        uses: actions/github-script@v8
        with:
          script: |
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'vcpkg-drift',
              state: 'open',
            });
            if (issues.data.length > 0) {
              core.warning(`Open vcpkg-drift issue found – aborting until resolved.`);
              core.setOutput('blocked', 'true');
            } else {
              core.setOutput('blocked', 'false');
            }

      - name: Update DB
        if: steps.drift-check.outputs.blocked == 'false'
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const crypto = require('crypto');
            const REPO = { owner: 'LadybirdBrowser', repo: 'ladybird' };
            const MAX_PAGES = 100;

            const latestFile = 'latest';
            const lastSha = fs.existsSync(latestFile)
              ? fs.readFileSync(latestFile, 'utf8').trim()
              : null;

            let nixpkgs = null;
            if (lastSha && fs.existsSync(`${lastSha}.toml`)) {
              const prev = fs.readFileSync(`${lastSha}.toml`, 'utf8');
              nixpkgs = prev.match(/^nixpkgs\s*=\s*"([^"]+)"/m)?.[1] ?? null;
            }
            if (!nixpkgs) {
              core.setFailed('No nixpkgs rev found – create initial TOML with nixpkgs set.');
              return;
            }

            const lbenv = (await github.rest.repos.getCommit(
              { owner: 'Sm00shed', repo: 'lbenv', ref: 'HEAD' },
            )).data.sha;

            const fresh = [];
            let pages = 0;
            let found = !lastSha;
            outer:
            for await (const page of github.paginate.iterator(
              github.rest.repos.listCommits, { ...REPO, per_page: 100 },
            )) {
              if (++pages > MAX_PAGES) break;
              for (const c of page.data) {
                if (lastSha && c.sha === lastSha) { found = true; break outer; }
                fresh.push({
                  sha: c.sha,
                  date: c.commit.committer.date.slice(0, 10),
                  time: c.commit.committer.date.slice(11, 16),
                  title: c.commit.message.split('\n')[0].slice(0, 100),
                });
                if (!lastSha) break outer;
              }
            }

            if (!found) {
              core.setFailed(
                `Last recorded commit ${lastSha} not found in newest `
                + `${MAX_PAGES * 100} commits; aborting.`,
              );
              return;
            }
            fresh.reverse();

            if (!fresh.length) {
              core.info('No new commits');
              return;
            }

            const overridesAt = async (ref) => {
              const f = await github.rest.repos.getContent(
                { ...REPO, path: 'vcpkg.json', ref },
              );
              const json = JSON.parse(Buffer.from(f.data.content, 'base64').toString());
              return {
                baseline: json['builtin-baseline'] ?? '',
                overrides: Object.fromEntries((json.overrides ?? []).map(p => [p.name, p.version])),
              };
            };

            const hashOverrides = (o) => crypto.createHash('sha256')
              .update(JSON.stringify(Object.entries(o).sort()))
              .digest('hex');

            // Previous vcpkg state for drift comparison (null = no baseline, skip check)
            let prevV = null;
            let prevHash = null;
            if (lastSha && fs.existsSync(`${lastSha}.toml`)) {
              const prevToml = fs.readFileSync(`${lastSha}.toml`, 'utf8');
              prevHash = prevToml.match(/^vcpkg\s*=\s*"([^"]+)"/m)?.[1] ?? null;
              if (prevHash) prevV = await overridesAt(lastSha);
            }

            let lastGoodSha = lastSha;
            let written = 0;

            for (const c of fresh) {
              const v = await overridesAt(c.sha);
              const currentHash = hashOverrides(v.overrides);

              if (prevHash !== null && (currentHash !== prevHash || v.baseline !== prevV.baseline)) {
                const allPkgs = [...new Set([
                  ...Object.keys(prevV.overrides),
                  ...Object.keys(v.overrides),
                ])].sort();
                const rows = allPkgs
                  .filter(p => prevV.overrides[p] !== v.overrides[p])
                  .map(p => `| ${p} | ${prevV.overrides[p] ?? '-'} | ${v.overrides[p] ?? '-'} |`);

                const head = c.sha.slice(0, 8);
                const base = (lastGoodSha ?? '?').slice(0, 8);
                const bodyLines = [
                  '## vcpkg.json changed in Ladybird',
                  '',
                  `\`${base}\` -> \`${head}\``,
                  '',
                ];
                if (prevV.baseline !== v.baseline) {
                  bodyLines.push(
                    `**builtin-baseline**: \`${prevV.baseline || '-'}\` → \`${v.baseline || '-'}\``,
                    '',
                  );
                }
                if (rows.length) {
                  bodyLines.push('| Package | before | now |', '|---|---|---|', ...rows, '');
                }
                bodyLines.push('_Check whether the nixpkgs pins in `flake.nix` need adjusting._');

                await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title: `vcpkg drift @ ${head}`,
                  labels: ['vcpkg-drift'],
                  body: bodyLines.join('\n'),
                });
                break;
              }

              const toml = [
                `ladybird = "${c.sha}"`,
                `nixpkgs  = "${nixpkgs}"`,
                `vcpkg    = "${currentHash}"`,
                `baseline = "${v.baseline}"`,
                `date     = "${c.date}"`,
                `time     = "${c.time}"`,
                `title    = "${c.title.replace(/"/g, '\\"')}"`,
                `# flake filled in commit 2`,
                `lbenv    = "${lbenv}"`,
              ].join('\n') + '\n';

              fs.writeFileSync(`${c.sha}.toml`, toml);
              lastGoodSha = c.sha;
              prevV = v;
              prevHash = currentHash;
              written++;
            }

            if (written > 0) {
              fs.writeFileSync(latestFile, lastGoodSha + '\n');
              core.info(`Added ${written} commits`);
            }

      - name: Commit and push
        if: steps.drift-check.outputs.blocked == 'false'
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add *.toml latest
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          COUNT=$(git diff --cached --name-only | grep -c '\.toml$' || true)

          # Commit 1: new TOML files without flake rev
          git commit -m "db: add $COUNT Ladybird commits ($(date -u +%F))"
          git pull --rebase --autostash
          git push
          FLAKE_REV=$(git rev-parse HEAD)

          # Commit 2: backfill flake rev into new TOML files
          for f in *.toml; do
            if grep -q '^# flake filled in commit 2' "$f"; then
              sed -i "s|^# flake filled in commit 2|flake    = \"$FLAKE_REV\"|" "$f"
            fi
          done

          git add *.toml
          if git diff --cached --quiet; then
            echo "No flake backfill needed"
            exit 0
          fi
          git commit -m "db: backfill flake rev ${FLAKE_REV:0:8}"
          git pull --rebase --autostash
          git push
