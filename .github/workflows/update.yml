name: Update Ladybird versions

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: update-versions
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check for open vcpkg-drift issue
        id: drift-check
        uses: actions/github-script@v8
        with:
          script: |
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'vcpkg-drift',
              state: 'open',
            });
            if (issues.data.length > 0) {
              core.warning(`Open vcpkg-drift issue found – aborting until resolved.`);
              core.setOutput('blocked', 'true');
            } else {
              core.setOutput('blocked', 'false');
            }

      - name: Update DB
        if: steps.drift-check.outputs.blocked == 'false'
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const crypto = require('crypto');
            const REPO = { owner: 'LadybirdBrowser', repo: 'ladybird' };
            const MAX_PAGES = 100;

            // Read latest recorded SHA from `latest` file
            const latestFile = 'latest';
            const lastSha = fs.existsSync(latestFile)
              ? fs.readFileSync(latestFile, 'utf8').trim()
              : null;

            // nixpkgs rev carried forward from last TOML (changes only on drift)
            let nixpkgs = null;
            if (lastSha && fs.existsSync(`${lastSha}.toml`)) {
              const prev = fs.readFileSync(`${lastSha}.toml`, 'utf8');
              nixpkgs = prev.match(/^nixpkgs\s*=\s*"([^"]+)"/m)?.[1] ?? null;
            }
            if (!nixpkgs) {
              core.setFailed('No nixpkgs rev found – create initial TOML with nixpkgs set.');
              return;
            }

            // Current lbenv build-logic rev (Sm00shed/lbenv HEAD); pins flake.nix + overrides
            const lbenv = (await github.rest.repos.getCommit(
              { owner: 'Sm00shed', repo: 'lbenv', ref: 'HEAD' },
            )).data.sha;

            // Collect commits newer than lastSha
            const fresh = [];
            let pages = 0;
            let found = !lastSha;
            outer:
            for await (const page of github.paginate.iterator(
              github.rest.repos.listCommits, { ...REPO, per_page: 100 },
            )) {
              if (++pages > MAX_PAGES) break;
              for (const c of page.data) {
                if (lastSha && c.sha === lastSha) { found = true; break outer; }
                fresh.push({
                  sha: c.sha,
                  date: c.commit.committer.date.slice(0, 10),
                  time: c.commit.committer.date.slice(11, 16),
                  title: c.commit.message.split('\n')[0].slice(0, 100),
                });
                if (!lastSha) break outer;
              }
            }

            if (!found) {
              core.setFailed(
                `Last recorded commit ${lastSha} not found in newest `
                + `${MAX_PAGES * 100} commits; aborting.`,
              );
              return;
            }
            fresh.reverse();

            if (!fresh.length) {
              core.info('No new commits');
              return;
            }

            // vcpkg overrides at a given ref
            const overridesAt = async (ref) => {
              const f = await github.rest.repos.getContent(
                { ...REPO, path: 'vcpkg.json', ref },
              );
              const json = JSON.parse(Buffer.from(f.data.content, 'base64').toString());
              return {
                baseline: json['builtin-baseline'] ?? null,
                overrides: Object.fromEntries((json.overrides ?? []).map(p => [p.name, p.version])),
              };
            };

            const hashOverrides = (o) => crypto.createHash('sha256')
              .update(JSON.stringify(Object.entries(o).sort()))
              .digest('hex');

            let latestVcpkg = null;
            for (const c of fresh) {
              const v = await overridesAt(c.sha);
              latestVcpkg = v;

              // Write TOML file (full hashes, no flake yet)
              const toml = [
                `ladybird = "${c.sha}"`,
                `nixpkgs  = "${nixpkgs}"`,
                `vcpkg    = "${hashOverrides(v.overrides)}"`,
                `baseline = "${v.baseline ?? ''}"`,
                `date     = "${c.date}"`,
                `time     = "${c.time}"`,
                `title    = "${c.title.replace(/"/g, '\\"')}"`,
                `# flake filled in commit 2`,
                `lbenv    = "${lbenv}"`,
              ].join('\n') + '\n';

              fs.writeFileSync(`${c.sha}.toml`, toml);
            }

            // Update `latest`
            fs.writeFileSync(latestFile, fresh.at(-1).sha + '\n');
            core.info(`Added ${fresh.length} commits`);

            // Drift check
            const prevTomlPath = lastSha ? `${lastSha}.toml` : null;
            if (!prevTomlPath || !fs.existsSync(prevTomlPath)) return;

            const prevToml = fs.readFileSync(prevTomlPath, 'utf8');
            const prevVcpkgHash = prevToml.match(/^vcpkg\s*=\s*"([^"]+)"/m)?.[1];
            if (!prevVcpkgHash || prevVcpkgHash === hashOverrides(latestVcpkg.overrides)) return;

            // Drift detected – create issue
            const prev = await overridesAt(lastSha);
            const rows = [...new Set([...Object.keys(prev.overrides), ...Object.keys(latestVcpkg.overrides)])]
              .sort()
              .filter(p => prev.overrides[p] !== latestVcpkg.overrides[p])
              .map(p => `| ${p} | ${prev.overrides[p] ?? '-'} | ${latestVcpkg.overrides[p] ?? '-'} |`);

            const head = fresh.at(-1).sha.slice(0, 8);
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `vcpkg drift @ ${head}`,
              labels: ['vcpkg-drift'],
              body: [
                '## vcpkg.json changed in Ladybird',
                '',
                `\`${lastSha.slice(0, 8)}\` -> \`${head}\``,
                '',
                '| Package | before | now |',
                '|---|---|---|',
                ...rows,
                '',
                '_Check whether the nixpkgs pins in `flake.nix` need adjusting._',
              ].join('\n'),
            });

      - name: Commit and push
        if: steps.drift-check.outputs.blocked == 'false'
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add *.toml latest
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          COUNT=$(git diff --cached --name-only | grep -c '\.toml$' || true)

          # Commit 1: new TOML files without flake rev
          git commit -m "db: add $COUNT Ladybird commits ($(date -u +%F))"
          git pull --rebase --autostash
          git push
          FLAKE_REV=$(git rev-parse HEAD)

          # Commit 2: backfill flake rev into new TOML files
          for f in *.toml; do
            if grep -q '^# flake filled in commit 2' "$f"; then
              sed -i "s|^# flake filled in commit 2|flake    = \"$FLAKE_REV\"|" "$f"
            fi
          done

          git add *.toml
          if git diff --cached --quiet; then
            echo "No flake backfill needed"
            exit 0
          fi
          git commit -m "db: backfill flake rev ${FLAKE_REV:0:8}"
          git pull --rebase --autostash
          git push
