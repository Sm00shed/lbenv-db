name: Migrate versions.json

on:
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout lbenv-db
        uses: actions/checkout@v4

      - name: Fetch versions.json from lbenv
        run: |
          curl -fsSL \
            "https://raw.githubusercontent.com/Sm00shed/lbenv/main/versions.json" \
            -o versions.json

      - name: Run migration
        run: |
          python3 - <<'EOF'
          import json, os

          with open("versions.json") as f:
              versions = json.load(f)

          entries = list(versions.items())
          last_sha = None

          for key, v in entries:
              date = key.split("_")[0]
              sha = v["ladybird"]

              toml = f'ladybird = "{sha}"\n'
              toml += f'nixpkgs  = "{v["nixpkgs"]}"\n'
              if "vcpkg" in v:
                  toml += f'vcpkg    = "{v["vcpkg"]}"\n'
              toml += f'date     = "{date}"\n'
              toml += f'time     = "{v["time"]}"\n'
              toml += f'title    = "{v["title"]}"\n'
              if "flake" in v:
                  toml += f'flake    = "{v["flake"]}"\n'

              with open(f"{sha}.toml", "w") as f:
                  f.write(toml)

              last_sha = sha

          with open("latest", "w") as f:
              f.write(last_sha + "\n")

          print(f"Migrated {len(entries)} entries.")
          print(f"latest -> {last_sha}")
          EOF

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add *.toml latest
          git diff --cached --quiet && echo "Nothing to commit" && exit 0
          git commit -m "Migrate $(cat latest | cut -c1-8): import $(ls *.toml | wc -l) entries from versions.json"
          git push
